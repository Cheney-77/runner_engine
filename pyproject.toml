[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-python-runner-engine"
version = "3.3.0"
description = "Managed Python operator build, publish and runtime platform for NiFi"
requires-python = ">=3.11"

dependencies = [
  "PyYAML>=6.0",
]
[project.optional-dependencies]
grpc = ["grpcio>=1.65", "grpcio-tools>=1.65"]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
build = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7",  "packaging>=24.0", "uv>=0.8", "psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
publish = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]



[project.scripts]
mpr-publish = "runner_engine.publisher:main"
mpr-agent = "runner_engine.worker.agent:main"
mpr-runner = "runner_engine.app:main"
mpr-build-service = "build_service.app:main"
mpr-publish-service = "publish_service.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runner_engine*", "build_service*", "operator_authoring*", "publish_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
